name: Web checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # mobile/ is outside the workspaces, but the root vitest run includes its tests and its tsconfig extends expo.
      - run: npm ci --prefix mobile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
  verify-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install -r ai/requirements.txt
      - run: python -m pytest ai/tests
